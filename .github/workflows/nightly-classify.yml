name: Nightly classification run

on:
  schedule:
    # 11:00 UTC daily -- before the ~8am local morning review session
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      filing_limit:
        description: "Max 8-K filings to classify this run (blank = default 150)"
        required: false
        default: "150"
      news_limit:
        description: "Max news candidates to classify this run (blank = default 100)"
        required: false
        default: "100"

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install supabase requests

      - name: Run 8-K filing classifier (capped)
        id: filings
        env:
          FILING_LIMIT: ${{ github.event.inputs.filing_limit || '150' }}
        run: |
          set +e
          echo "Using filing limit: $FILING_LIMIT"
          OUTPUT=$(python scripts/classification/classify_8k_filings_batch_v2.py ALL --limit "$FILING_LIMIT" --yes 2>&1)
          EXIT_CODE=$?
          echo "$OUTPUT"
          echo "## 8-K Filing Classifier (limit: $FILING_LIMIT)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$OUTPUT" | tail -20 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if echo "$OUTPUT" | grep -q "LIMIT_REACHED"; then
            echo "### :warning: Limit reached -- another run is needed" >> "$GITHUB_STEP_SUMMARY"
            echo "$OUTPUT" | grep "LIMIT_REACHED" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $EXIT_CODE

      - name: Run Track B news classifier (capped)
        id: news
        env:
          NEWS_LIMIT: ${{ github.event.inputs.news_limit || '100' }}
        run: |
          set +e
          echo "Using news limit: $NEWS_LIMIT"
          OUTPUT=$(python scripts/classification/classify_news_candidates.py --limit "$NEWS_LIMIT" 2>&1)
          EXIT_CODE=$?
          echo "$OUTPUT"
          echo "## Track B News Classifier (limit: $NEWS_LIMIT)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$OUTPUT" | tail -20 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if echo "$OUTPUT" | grep -q "LIMIT_REACHED"; then
            echo "### :warning: Limit reached -- another run is needed" >> "$GITHUB_STEP_SUMMARY"
            echo "$OUTPUT" | grep "LIMIT_REACHED" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $EXIT_CODE
